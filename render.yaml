services:
  - type: web
    name: garmin-duo-coach
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt
    disk:
      name: coach-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5050
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GARMIN_TOKENS_BASE64
        sync: false
      - key: GARMIN_CLARA_TOKENS_BASE64
        sync: false
      - key: COACH_AUTH_PIN
        sync: false
