services:
  - type: web
    name: garmin-duo-coach
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    region: frankfurt
    disk:
      name: coach-data
      mountPath: /app/data
      sizeGB: 1
    healthCheckPath: /api/status
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5050
      # Votre propre API LLM (OpenAI-compatible, vLLM, LiteLLM, etc.)
      - key: COACH_LLM_BASE_URL
        sync: false
      - key: COACH_LLM_API_KEY
        sync: false
      - key: COACH_LLM_MODEL
        sync: false
      # Jetons de connexion Garmin
      - key: GARMIN_TOKENS_BASE64
        sync: false
      - key: GARMIN_CLARA_TOKENS_BASE64
        sync: false
      # Code PIN d'accès sécurisé pour le couple
      - key: COACH_AUTH_PIN
        sync: false
