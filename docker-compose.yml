services:
  garmin-duo-coach:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garmin-duo-coach
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - HOST=0.0.0.0
      - PORT=5050
      # Tokens Garmin (automatiquement injectés depuis les variables d'environnement)
      - GARMIN_TOKENS_BASE64=${GARMIN_TOKENS_BASE64:-}
      - GARMIN_CLARA_TOKENS_BASE64=${GARMIN_CLARA_TOKENS_BASE64:-}
      # Clés LLM pour le coach IA (Gemini, OpenAI, Anthropic)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      # Protection par code PIN pour l'accès public (optionnel mais recommandé en cloud)
      - COACH_AUTH_PIN=${COACH_AUTH_PIN:-}
    volumes:
      # Persistance de la base SQLite, de la mémoire épisodique et de ChromaDB RAG
      - coach-data:/app/data
      # Persistance des tokens Garmin sur disque hôte
      - garmin-tokens-louis:/root/.garminconnect
      - garmin-tokens-clara:/root/.garminconnect_clara

volumes:
  coach-data:
    driver: local
  garmin-tokens-louis:
    driver: local
  garmin-tokens-clara:
    driver: local
